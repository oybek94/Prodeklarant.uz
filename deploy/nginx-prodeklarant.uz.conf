# prodeklarant.uz — Nginx server bloki namunami
# Nusxalash: sudo cp deploy/nginx-prodeklarant.uz.conf /etc/nginx/sites-available/prodeklarant.uz
# Yoqish:   sudo ln -s /etc/nginx/sites-available/prodeklarant.uz /etc/nginx/sites-enabled/
# Tekshirish: sudo nginx -t && sudo systemctl reload nginx
#
# SSL (Certbot): sudo certbot --nginx -d prodeklarant.uz -d www.prodeklarant.uz
# Certbot 80-blokni o'zgartirib 443 qo'shaydi; quyidagi server { listen 80 } yetarli.

server {
    listen 80;
    server_name prodeklarant.uz www.prodeklarant.uz;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
